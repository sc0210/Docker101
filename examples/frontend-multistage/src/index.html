<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Docker 101 — multi-stage demo</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; }

  <body>
    <h1>🐳 Built in a Node stage, served by nginx</h1>

    </p>
    <p id="arch"></p>
    <script src="app.js"></script>
  </body>

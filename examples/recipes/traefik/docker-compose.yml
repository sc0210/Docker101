# Traefik with local HTTPS. Certs are generated by ./gen-local-certs.sh
# (mkcert if installed, otherwise openssl self-signed) into ./certs.
#
# Host ports are 8080/8443 so they never collide; in production publish
# 80:80 and 443:443 and set the redirect port to 443.
name: docker101-traefik

services:
  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/dynamic      # static certs from dynamic/tls.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Uncomment to auto-redirect HTTP -> HTTPS (use when serving on 80/443):
      # - --entrypoints.web.http.redirections.entrypoint.to=websecure
      # - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # service discovery
      - ./dynamic:/dynamic:ro
      - ./certs:/certs:ro
    restart: unless-stopped

  whoami:
    image: traefik/whoami
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.localhost`)
      - traefik.http.routers.whoami.entrypoints=websecure
      - traefik.http.routers.whoami.tls=true
      - traefik.http.services.whoami.loadbalancer.server.port=80
